<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registrar">
<title>Registro rápido</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e17;--card:#141b2b;--tile:#1b2233;--line:rgba(255,255,255,.08);
    --txt:#eaf0fb;--muted:#8b96ad;--brand:#3b74ff;--ok:#22c55e;--bad:#ef4757;--save:#f5a623}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',system-ui,sans-serif;background:linear-gradient(160deg,#0b1330,#070a16);
    color:var(--txt);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:auto;padding-top:8px}
  .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b74ff,#2b5cf0);display:grid;place-items:center;font-weight:800}
  .top b{font-size:1.05rem}
  .wrap{margin:auto 0;display:flex;flex-direction:column;gap:16px}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.5px}
  .seg{display:flex;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:5px;gap:5px}
  .seg label{flex:1;text-align:center;padding:12px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted)}
  .seg input{display:none}
  .seg label:has(input[value="gasto"]:checked){background:rgba(239,71,87,.18);color:var(--bad)}
  .seg label:has(input[value="ingreso"]:checked){background:rgba(34,197,94,.18);color:var(--ok)}
  .seg label:has(input[value="ahorro"]:checked){background:rgba(245,166,35,.18);color:var(--save)}
  input.f{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:14px;padding:16px;font-size:1.1rem;font-family:inherit}
  input.f:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,116,255,.2)}
  .monto-w{position:relative}
  .monto-w span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.1rem}
  .monto-w input{padding-left:32px;font-weight:700}
  button.go{background:linear-gradient(135deg,#3b74ff,#2b5cf0);border:0;color:#fff;font-weight:800;
    font-size:1.1rem;padding:17px;border-radius:14px;cursor:pointer}
  button.go:active{transform:scale(.99)}
  button.go:disabled{opacity:.5}
  .msg{border-radius:14px;padding:16px;text-align:center;font-weight:600;font-size:1rem;display:none}
  .msg.ok{background:rgba(34,197,94,.14);color:#a7f0c4;display:block}
  .msg.err{background:rgba(239,71,87,.14);color:#ffb3bd;display:block}
  .foot{margin-top:auto;text-align:center;padding-top:16px}
  .foot a{color:var(--muted);font-size:.85rem;text-decoration:none}
  .hint{color:var(--muted);font-size:.82rem;text-align:center}
</style>
</head>
<body>
  <div class="top"><span class="dot">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l5-5 4 4 7-8"/><path d="M17 6h4v4"/></svg>
  </span><b>Registro rápido</b></div>

  <div class="wrap" id="form">
    <h1>¿Qué registras?</h1>
    <div class="seg" id="seg">
      <label><input type="radio" name="tipo" value="gasto" checked><span>Gasto</span></label>
      <label><input type="radio" name="tipo" value="ingreso"><span>Ingreso</span></label>
      <label><input type="radio" name="tipo" value="ahorro"><span>Ahorro</span></label>
    </div>
    <input class="f" id="desc" placeholder="¿Qué es? (ej. cena, salario)" autocomplete="off" autofocus>
    <div class="monto-w"><span>$</span><input class="f" id="monto" placeholder="¿Cuánto?" inputmode="decimal"></div>
    <button class="go" id="go">Guardar</button>
    <div class="msg" id="msg"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="foot"><a id="panel" href="/">Ver mi panel completo →</a></div>

<script>
const RAPIDO_URL = "https://fhixjvxztmuifrioevze.supabase.co/functions/v1/registro-rapido";
const params = new URLSearchParams(location.search);
const token = params.get("token") || localStorage.getItem("mf_token") || "";
if(token) localStorage.setItem("mf_token", token);
const $ = id => document.getElementById(id);

if(!token){
  $("hint").innerHTML = 'Falta tu clave. Abre este acceso desde tu app (sección “Registro rápido”).';
}

async function guardar(){
  const desc = $("desc").value.trim();
  const monto = $("monto").value.trim();
  const tipo = document.querySelector('input[name=tipo]:checked').value;
  const msg = $("msg");
  if(!token){ msg.className="msg err"; msg.textContent="No hay clave configurada."; return; }
  if(!desc){ $("desc").focus(); return; }
  if(!monto){ $("monto").focus(); return; }
  $("go").disabled = true; $("go").textContent = "Guardando…";
  msg.className="msg"; msg.style.display="none";
  try{
    const r = await fetch(RAPIDO_URL, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ token, desc, monto, tipo })
    });
    const data = await r.json().catch(()=>({}));
    if(r.ok && data.ok){
      msg.className="msg ok"; msg.textContent = data.message || "¡Guardado!";
      $("desc").value=""; $("monto").value=""; $("desc").focus();
    }else{
      msg.className="msg err"; msg.textContent = data.message || ("Error ("+r.status+")");
    }
  }catch(e){
    msg.className="msg err"; msg.textContent = "Sin conexión. Intenta de nuevo.";
  }
  $("go").disabled=false; $("go").textContent="Guardar";
}
$("go").onclick = guardar;
$("monto").addEventListener("keydown", e=>{ if(e.key==="Enter") guardar(); });
</script>
</body>
</html>
