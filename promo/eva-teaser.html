<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eva — Teaser (expectativa)</title>
<style>
@font-face{font-family:'Montserrat';font-weight:400;src:url(fonts/montserrat-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:700;src:url(fonts/playfair-display-latin-700-normal.woff2) format('woff2')}
:root{--bg:#0B0712;--brand:#E24BD8;--brand2:#A855F7;--rosa:#F06CE0;--magenta:#C026D3;--txt:#F3EEFB;--muted:#A99FB8;--muted2:#6E6480}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Montserrat',sans-serif;color:var(--txt)}
.stage{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
.grad{background:linear-gradient(120deg,var(--rosa),var(--brand) 55%,var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* cámara: empuje lento continuo */
.cam{position:absolute;inset:0;animation:push 20s linear both}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.06)}}

/* grano + viñeta */
.grain{position:absolute;inset:-200px;z-index:90;pointer-events:none;opacity:.10;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-40px,20px)}50%{transform:translate(30px,-30px)}75%{transform:translate(-20px,-40px)}100%{transform:translate(0,0)}}
.vig{position:absolute;inset:0;z-index:89;pointer-events:none;background:radial-gradient(900px 1300px at 50% 50%,transparent 45%,rgba(0,0,0,.85))}

/* ===== Escena 1: Fin de mes / ¿Y la plata? (0–6.3s) ===== */
.s1{animation:s1 6.3s linear 0s both}
@keyframes s1{0%{opacity:1}92%{opacity:1}100%{opacity:0}}
.num{position:absolute;font-weight:700;font-size:44px;color:var(--muted2);opacity:0;white-space:nowrap}
@keyframes fall{0%{opacity:0;transform:translateY(-120px)}15%{opacity:.55}80%{opacity:.35}100%{opacity:0;transform:translateY(900px)}}
.t1{font-size:120px;font-weight:900;letter-spacing:-3px;line-height:1.05;position:relative;z-index:3}
.t1::before{content:"";position:absolute;left:-220px;right:-220px;top:-200px;bottom:-200px;z-index:-1;background:radial-gradient(closest-side,rgba(11,7,18,.95),rgba(11,7,18,.7) 55%,transparent)}
.t1 .a{display:block;opacity:0;animation:blurIn 1.1s cubic-bezier(.2,.7,.2,1) .5s both}
.t1 .b{display:block;opacity:0;margin-top:28px;animation:blurIn 1.1s cubic-bezier(.2,.7,.2,1) 2.4s both}
@keyframes blurIn{from{opacity:0;filter:blur(24px);transform:scale(1.08)}to{opacity:1;filter:none;transform:none}}
.glitch{animation:glitch .5s steps(2) 5.6s both}
@keyframes glitch{0%{transform:none;filter:none}20%{transform:translate(-14px,6px) skewX(-8deg);filter:hue-rotate(60deg)}40%{transform:translate(12px,-4px);filter:none}60%{transform:translate(-6px,0) skewX(6deg);opacity:.6}100%{transform:scale(1.02);opacity:0}}

/* ===== Escena 2: Algo está por cambiar (6.3–10.2s) ===== */
.s2{animation:s2 3.9s linear 6.3s both}
@keyframes s2{0%{opacity:0}6%{opacity:1}88%{opacity:1}100%{opacity:0}}
.t2{font-size:104px;font-weight:900;letter-spacing:-3px;line-height:1.08}
.w{display:inline-block;opacity:0;animation:wordIn .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes wordIn{from{opacity:0;transform:translateY(40px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.line{width:0;height:6px;border-radius:3px;margin-top:60px;background:linear-gradient(90deg,var(--rosa),var(--brand),var(--brand2));
  box-shadow:0 0 30px rgba(226,75,216,.8);animation:grow 2.2s cubic-bezier(.6,0,.2,1) 7.6s both}
@keyframes grow{to{width:520px}}

/* ===== Escena 3–4: revelación de la E + tagline (10.2–17s) ===== */
.s3{animation:s3 6.8s linear 10.2s both}
@keyframes s3{0%{opacity:0}3%{opacity:1}94%{opacity:1}100%{opacity:0}}
.halo{position:absolute;width:1100px;height:1100px;border-radius:50%;
  background:radial-gradient(circle,rgba(226,75,216,.55),rgba(168,85,247,.18) 45%,transparent 70%);
  opacity:0;animation:halo 2.4s ease-out 10.5s both, breathe 3s ease-in-out 12.9s infinite}
@keyframes halo{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1.15)}100%{opacity:.75;transform:scale(1)}}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:.55}}
.logo{position:relative;display:flex;align-items:baseline;justify-content:center;animation:logoUp 1.2s cubic-bezier(.6,0,.2,1) 13.6s both}
@keyframes logoUp{from{transform:none}to{transform:translateY(-140px) scale(.82)}}
.E{font-family:'Playfair Display',serif;font-weight:700;font-size:620px;line-height:.8;
  background:linear-gradient(160deg,#F6A8EF 0%,var(--brand) 45%,var(--magenta) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 20px 60px rgba(194,38,211,.6));opacity:0;animation:eIn 1.6s cubic-bezier(.2,.7,.2,1) 10.6s both}
@keyframes eIn{0%{opacity:0;transform:scale(1.5);filter:blur(30px) drop-shadow(0 0 0 rgba(0,0,0,0))}60%{opacity:1}100%{opacity:1;transform:none;filter:blur(0) drop-shadow(0 20px 60px rgba(194,38,211,.6))}}
.va{font-weight:600;font-size:300px;letter-spacing:-6px;color:var(--txt);margin-left:-8px;opacity:0;
  animation:vaIn 1s cubic-bezier(.2,.7,.2,1) 12.3s both}
@keyframes vaIn{from{opacity:0;transform:translateX(-50px);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.sweep{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);
  transform:translateX(-120%);animation:sweep 1.4s ease-in-out 11.4s both;mix-blend-mode:overlay}
@keyframes sweep{to{transform:translateX(120%)}}
.tag{position:absolute;top:1180px;left:0;right:0;font-size:64px;font-weight:700;letter-spacing:-1px;opacity:0;
  animation:blurIn 1.1s cubic-bezier(.2,.7,.2,1) 14.2s both}
.tag .m{color:var(--muted)}

/* ===== Escena 5: Ya está aquí (17–20s) ===== */
.s5{animation:s5 3s linear 17s both}
@keyframes s5{0%{opacity:0}10%{opacity:1}100%{opacity:1}}
.mini{display:flex;align-items:baseline;justify-content:center;margin-bottom:70px;opacity:0;animation:blurIn .9s ease-out 17.1s both}
.mini .E{font-size:200px;opacity:1;animation:none;filter:drop-shadow(0 10px 30px rgba(194,38,211,.6))}
.mini .va{font-size:100px;letter-spacing:-2px;opacity:1;animation:none;margin-left:-3px}
.soon{font-size:124px;font-weight:900;letter-spacing:-4px;line-height:1;opacity:0;animation:soonIn 1.2s cubic-bezier(.2,.7,.2,1) 17.5s both}
@keyframes soonIn{from{opacity:0;letter-spacing:30px;filter:blur(16px)}to{opacity:1;letter-spacing:-4px;filter:none}}
.url{margin-top:60px;font-size:44px;font-weight:600;color:var(--muted);letter-spacing:2px;opacity:0;animation:blurIn 1s ease-out 18.4s both}
.url b{color:var(--brand);font-weight:700}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#ffd6fb,#e24bd8 60%,#0b0712);opacity:0;z-index:80;pointer-events:none;mix-blend-mode:screen;animation:flash .45s ease-out 10.55s both}
@keyframes flash{0%{opacity:0}12%{opacity:.45}100%{opacity:0}}
</style>
</head>
<body>
<div class="stage">
  <div class="cam">

    <!-- 1 -->
    <div class="scene s1"><div class="glitch" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
      <div id="nums" style="position:absolute;inset:0"></div>
      <div class="t1"><span class="a">Fin de mes.</span><span class="b grad">¿Y la plata?</span></div>
    </div></div>

    <!-- 2 -->
    <div class="scene s2">
      <div class="t2">
        <span class="w" style="animation-delay:6.6s">Algo</span>
        <span class="w" style="animation-delay:6.95s">está</span><br>
        <span class="w" style="animation-delay:7.3s">por</span>
        <span class="w grad" style="animation-delay:7.7s">cambiar.</span>
      </div>
      <div class="line"></div>
    </div>

    <!-- 3–4 -->
    <div class="scene s3">
      <div class="halo"></div>
      <div class="logo"><span class="E">E</span><span class="va">va</span><div class="sweep"></div></div>
      <div class="tag">Tus finanzas, <span class="grad">bajo control.</span></div>
    </div>

    <!-- 5: Ya está aquí -->
    <div class="scene s5">
      <div class="mini"><span class="E">E</span><span class="va">va</span></div>
      <div class="soon">Ya está <span class="grad">aquí.</span></div>
      <div class="url">evafinanzas<b>.us</b></div>
    </div>

    <div class="flash"></div>
  </div>
  <div class="vig"></div>
  <div class="grain"></div>
</div>
<script>
// Números de gastos cayendo (anónimos, sin detalle) — posiciones deterministas
(function(){
  let s=7; const r=()=> (s=(s*16807)%2147483647)/2147483647;
  const vals=["-$45.000","-$12.900","-$230.000","-$8.500","-$67.000","-$19.990","-$150.000","-$3.200","-$89.000","-$27.500","-$310.000","-$54.900","-$6.700","-$120.000"];
  const box=document.getElementById("nums");
  for(let i=0;i<34;i++){
    const d=document.createElement("div"); d.className="num";
    d.textContent=vals[i%vals.length];
    d.style.left=(40+r()*900)+"px"; d.style.top=(r()*1000)+"px";
    d.style.fontSize=(30+r()*34)+"px";
    const delay=0.2+r()*5.2, dur=2.2+r()*2.2;
    d.style.animation=`fall ${dur}s linear ${delay}s both`;
    box.appendChild(d);
  }
})();
</script>
</body>
</html>
