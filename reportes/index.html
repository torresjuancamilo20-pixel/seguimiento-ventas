<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NX LEGENDARY</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="LEGENDARY">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f3a43">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
 --ink:#e6ecf5;--ink2:#aab6c8;--mut:#6b7688;--line:#1e2836;--line2:#171f2b;
 --paper:#080b12;--white:#0f1520;--card:#0f1520;
 --sig:#3b82f6;--sigd:#60a5fa;--sigbg:rgba(59,130,246,.12);
 --good:#22c55e;--goodbg:rgba(34,197,94,.11);--warn:#eab308;--warnbg:rgba(234,179,8,.11);
 --red:#ef4444;--redbg:rgba(239,68,68,.11);--gold:#f5c518;--goldbg:rgba(245,197,24,.10);
 --sh:0 1px 2px rgba(0,0,0,.4);--shl:0 8px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;color-scheme:dark}
input,select{color:var(--ink)}
.hide{display:none!important}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1000px 500px at 20% -10%,rgba(59,130,246,.09),transparent),var(--paper)}
.login-card{background:var(--white);border:1px solid var(--line);border-radius:18px;width:100%;max-width:410px;padding:32px 28px;box-shadow:var(--shl)}
.brand-badge{display:inline-flex;align-items:center;gap:9px;margin-bottom:16px}
.brand-badge .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#1e293b,#334155);color:#e6ecf5;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:13px}
.brand-badge .tx{font-family:'Space Grotesk';font-weight:700;letter-spacing:.06em;font-size:13px}
.login-card h1{font-family:'Space Grotesk';font-weight:700;font-size:23px;margin:2px 0 4px}
.login-card p.sub{color:var(--mut);font-size:13px;margin-bottom:18px;line-height:1.5}
.roletabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5px}
.roletab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;border-radius:8px}
.roletab.on{background:var(--white);color:var(--ink);box-shadow:var(--sh)}
label.fl{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:700;display:block;margin:12px 0 7px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);font-family:'Inter';font-size:15px}
.inp:focus{outline:none;border-color:var(--sig);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.btn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--sig);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px}
.btn:hover{background:#2f6fd6}.btn:disabled{opacity:.5}
.err{color:var(--red);font-size:12.5px;margin-top:10px;font-weight:600;min-height:16px}

/* SHELL */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:#0a0e16;border-right:1px solid var(--line);color:#aab6c8;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:14px}
.logo .mk{width:30px;height:30px;border-radius:9px;border:1.5px solid rgba(255,255,255,.18);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:13px;color:#e6ecf5}
.logo .tx{font-family:'Space Grotesk';font-weight:700;letter-spacing:.2em;font-size:12px;color:#e6ecf5}
nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:#8592a6;cursor:pointer}
.nav-item .i{font-size:14px;width:18px;text-align:center;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.05);color:#dbe3ef}
.nav-item.active{background:rgba(59,130,246,.14);color:#dbe6fb;box-shadow:inset 0 0 0 1px rgba(59,130,246,.3)}
.side-foot{margin-top:auto;padding-top:16px}
.side-btn{width:100%;display:flex;align-items:center;gap:8px;justify-content:center;padding:10px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.04);color:#cbd5e1;font-size:12.5px;font-weight:600;cursor:pointer}
.side-btn:hover{background:rgba(255,255,255,.09);color:#fff}

.main{flex:1;min-width:0;padding:26px 30px 70px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sigd);font-weight:700}
h1.title{font-family:'Space Grotesk';font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.05;letter-spacing:-.02em;margin-top:6px}
.subtitle{color:var(--mut);font-size:13px;margin-top:6px}
.whoami{display:flex;align-items:center;gap:11px}
.whoami .av{width:38px;height:38px;border-radius:50%;background:var(--sig);color:#fff;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:13px}
.whoami .av.dir{background:#1e293b}
.logout-top{border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.logout-top:hover{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#f87171}
.kpi-ic svg,.nav-item .i svg{width:15px;height:15px;display:block}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;flex-shrink:0}
.pill{display:inline-flex;align-items:center}
.pform{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.pform .fg{display:flex;flex-direction:column;gap:6px}
.pform label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:700}
.pform input,.pform select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:'Inter';font-size:13.5px}
.pform input:focus,.pform select:focus{outline:none;border-color:var(--sig)}
.pform .cli{min-width:200px;flex:1}
.pform .addbtn{padding:11px 18px;border:none;border-radius:10px;background:var(--sig);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
.pform .addbtn:hover{background:#2f6fd6}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;padding:4px 10px;border-radius:20px}
.tag.agendado{background:rgba(59,130,246,.14);color:#60a5fa}
.tag.posible{background:rgba(234,179,8,.14);color:#eab308}
.tag.pagado{background:rgba(34,197,94,.14);color:#4ade80}
.icobtn{border:1px solid var(--line);background:var(--paper);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer;font-weight:600}
.icobtn:hover{color:var(--ink);border-color:var(--sig)}
.icobtn.del:hover{color:#f87171;border-color:rgba(239,68,68,.4)}
.agrupo{margin-bottom:22px}
.agrupo-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:'Space Grotesk';font-weight:600;font-size:15px}
.agrupo-h .cnt{font-size:12px;color:var(--mut);font-weight:600}
.agrupo-h .sum{margin-left:auto;color:#4ade80;font-weight:700;font-size:14px}
.cellin{width:100%;min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:'Inter';font-size:13px}
.cellin.num{width:90px;min-width:0}
.cellin:focus{outline:none;border-color:var(--sig)}
.whoami .nm{font-weight:700;font-size:14px}
.whoami .ro{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* KPIs */
.kpis{display:grid;gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--sh)}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.kpi-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.kpi-l{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);font-weight:700}
.kpi-n{font-family:'Space Grotesk';font-weight:700;font-size:26px;line-height:1}
.kpi-ic{background:rgba(148,163,184,.1);color:#8ea3bd;border:1px solid rgba(148,163,184,.14)}
.ic-blue,.ic-green,.ic-gold,.ic-violet{background:rgba(148,163,184,.1);color:#8ea3bd}

/* toolbar */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{padding:9px 15px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--white);color:var(--ink2)}
.chip.on{background:var(--sigbg);border-color:rgba(59,130,246,.4);color:var(--sigd)}
.bar input[type=date]{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--white);font-family:'Inter';font-size:12.5px}
.bar .sp{flex:1}

/* tables */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.section-t{font-family:'Space Grotesk';font-weight:600;font-size:16px;margin:2px 0 14px;display:flex;align-items:center;gap:9px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
thead th{background:#0b111b;text-align:right;padding:12px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:nth-child(1),thead th:nth-child(2){text-align:left}
tbody td{padding:12px 13px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.rk{text-align:center!important;color:var(--mut);font-weight:700;width:42px}
.ag{text-align:left!important;font-weight:600}
tr.top td{background:linear-gradient(90deg,rgba(245,197,24,.10),transparent)}
tr.top .ag{color:var(--gold)}
tr.me td{background:rgba(59,130,246,.08)}
tr.alert-row td{background:rgba(239,68,68,.09)}
.pill{display:inline-block;padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.g{color:var(--good);font-weight:800}.b{color:var(--sigd);font-weight:700}.money{color:var(--good);font-weight:800}
.z{color:#3a4658}
.conv{font-weight:800}
tfoot td{padding:13px;text-align:right;font-weight:800;border-top:2px solid var(--line);background:#0b111b}
tfoot td.lb{text-align:left;text-transform:uppercase;font-size:10px;letter-spacing:.05em;color:var(--gold)}
.barwrap{display:inline-block;width:70px;height:7px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;vertical-align:middle}
.barfill{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:5px}
.scroll{overflow-x:auto}
.note{margin-top:14px;font-size:11.5px;color:var(--mut);line-height:1.6;border-left:3px solid var(--gold);padding:8px 13px;background:var(--goldbg);border-radius:8px}
.setup{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.7}
.setup h3{font-family:'Space Grotesk';color:var(--ink);margin-bottom:8px}
.setup code{background:#0b111b;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--sigd);font-size:12px}
.loading{text-align:center;padding:44px;color:var(--mut);font-size:13px}
.av-sm{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;font-family:'Space Grotesk';vertical-align:middle;margin-right:9px}

@media(max-width:900px){
 .app{flex-direction:column}
 .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 12px;gap:12px}
 .logo{border:none;margin:0;padding:0}
 nav{flex:1;flex-direction:row;overflow-x:auto;gap:6px}
 .nav-item{white-space:nowrap}
 .side-foot{display:none}
 .main{padding:16px 14px 56px}
 .kpis{grid-template-columns:repeat(2,1fr)!important;gap:10px}
 .kpi-n{font-size:23px}
}
/* En celular, cada fila de la tabla se vuelve una TARJETA legible */
@media(max-width:680px){
 .panel.scroll{overflow:visible;background:transparent;border:none;box-shadow:none}
 table{font-size:15px}
 thead,tfoot{display:none}
 tbody,tr,td{display:block;width:100%}
 tbody tr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px;margin-bottom:12px}
 tbody tr.top{border-color:rgba(245,197,24,.4)}
 tbody tr.alert-row{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.06)}
 tbody tr.me{border-color:rgba(59,130,246,.45)}
 tbody td{display:flex;justify-content:space-between;align-items:center;text-align:right!important;padding:9px 0;border:none;border-bottom:1px solid rgba(255,255,255,.05);white-space:normal}
 tbody td:last-child{border-bottom:none}
 tbody td::before{content:attr(data-label);color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:left;margin-right:12px}
 tbody td.rk{display:none}
 tbody td.ag{justify-content:flex-start;text-align:left!important;font-size:17px;font-weight:700;padding-bottom:11px;margin-bottom:4px;border-bottom:1px solid var(--line)}
 tbody td.ag::before{display:none}
 tbody td.ag .av-sm{width:34px;height:34px;font-size:12px}
 .barwrap{width:60px}
}
</style></head><body>

// ¿es el mismo agente? igualdad exacta, o que un nombre completo contenga al otro
// (ej. "Felipe Ledesma" ⊂ "Juan Felipe Ledesma"). NUNCA por solo el primer nombre.
function sameAgent(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;if(a===b)return true;
 const ta=a.split(' '),tb=b.split(' ');if(ta.length<2||tb.length<2)return false; // evita calzar por un solo token
 return a.includes(b)||b.includes(a);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function celda(td){
 const inp=td.querySelector('input,select');
 if(inp)return inp.type==='checkbox'?(inp.checked?'Sí':'No'):(inp.value||'');
 const c=td.cloneNode(true);
 c.querySelectorAll('.av-sm,button,.barwrap').forEach(e=>e.remove()); // iniciales, botones y barras fuera
 const sub=c.querySelector('div');                                    // notas debajo del nombre
 let extra='';
 if(sub){extra=(sub.innerText||'').replace(/\s+/g,' ').trim();sub.remove();}
 const base=(c.innerText||'').replace(/\s+/g,' ').trim();
 return extra?(base+' — '+extra):base;
}

/* ---- Generador de Excel (.xlsx) sin librerías externas ---- */
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
const ENC=new TextEncoder();
function zipXlsx(files){ // files: [{name, data:Uint8Array}] guardados sin comprimir
 const locals=[],central=[];let off=0;
 files.forEach(f=>{
  const cr=crc32(f.data),n=ENC.encode(f.name);
  const lh=new Uint8Array(30+n.length),dv=new DataView(lh.buffer);
  dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);
  dv.setUint16(10,0,true);dv.setUint16(12,0,true);dv.setUint32(14,cr,true);
  dv.setUint32(18,f.data.length,true);dv.setUint32(22,f.data.length,true);
  dv.setUint16(26,n.length,true);dv.setUint16(28,0,true);lh.set(n,30);
  locals.push(lh,f.data);
  const ch=new Uint8Array(46+n.length),cv=new DataView(ch.buffer);
  cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
  cv.setUint32(16,cr,true);cv.setUint32(20,f.data.length,true);cv.setUint32(24,f.data.length,true);
  cv.setUint16(28,n.length,true);cv.setUint32(42,off,true);ch.set(n,46);
  central.push(ch);
  off+=lh.length+f.data.length;
 });
 const cdSize=central.reduce((s,c)=>s+c.length,0);
 const end=new Uint8Array(22),ev=new DataView(end.buffer);
 ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
 ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);
 const partes=[...locals,...central,end];
 const total=partes.reduce((s,p)=>s+p.length,0);
 const out=new Uint8Array(total);let p=0;partes.forEach(x=>{out.set(x,p);p+=x.length;});
 return out;
}
function xmlEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function colLetra(i){let s='';i++;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=(i-r-1)/26;}return s;}
function hojaXml(filas){
 let rows='';
 filas.forEach((fila,r)=>{
  let cs='';
  fila.forEach((v,c)=>{
   const ref=colLetra(c)+(r+1);
   if(v&&typeof v==='object'&&v.n!=null){
    cs+=`<c r="${ref}" s="${v.pct?2:1}"><v>${v.n}</v></c>`;
   }else if(v!==''&&v!=null){
    cs+=`<c r="${ref}" t="inlineStr"${r===0?' s="3"':''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
   }
  });
  rows+=`<row r="${r+1}">${cs}</row>`;
 });
 const nc=Math.max(...filas.map(f=>f.length));
 const cols='<cols>'+Array.from({length:nc},(_,i)=>`<col min="${i+1}" max="${i+1}" width="${i===1?26:15}" customWidth="1"/>`).join('')+'</cols>';
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData><autoFilter ref="A1:${colLetra(nc-1)}${filas.length}"/></worksheet>`;
}
function descargarXlsx(filas,nombreHoja,archivo){
 const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8EEF7"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`;
 const files=[
  {name:'[Content_Types].xml',data:ENC.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`)},
  {name:'_rels/.rels',data:ENC.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`)},
  {name:'xl/workbook.xml',data:ENC.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(nombreHoja).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`)},
  {name:'xl/_rels/workbook.xml.rels',data:ENC.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`)},
  {name:'xl/styles.xml',data:ENC.encode(styles)},
  {name:'xl/worksheets/sheet1.xml',data:ENC.encode(hojaXml(filas))},
 ];
 const blob=new Blob([zipXlsx(files)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=archivo;
 document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
}
// convierte "$1,578" -> 1578 y "40%" -> 0.4 para que Excel los trate como números
function valorCelda(txt){
 const s=String(txt).trim();
 if(!s||s==='—')return '';
 if(/^-?\$?\s?[\d.,]+$/.test(s)&&/\d/.test(s)){
  const n=parseFloat(s.replace(/[$\s]/g,'').replace(/,/g,''));
  if(!isNaN(n))return {n};
 }
 const mp=s.match(/^(-?[\d.,]+)\s?%$/);
 if(mp){const n=parseFloat(mp[1].replace(/,/g,''));if(!isNaN(n))return {n:n/100,pct:true};}
 return s;
}
function exportarCSV(){
 const vistas={ventas:['viewVentas','ventas'],ftds:['viewFtds',"ftds"],prod:['viewProd','productividad'],
   pagos:['viewPagos','ventas-pendientes'],clientes:['viewClientes','leads'],config:['viewConfig','configuracion']};
 const [id,slug]=vistas[PAGE]||[];
 const cont=id&&$(id);
 if(!cont){alert('No hay nada para exportar en esta sección.');return;}
 const tablas=[...cont.querySelectorAll('table')];
 if(!tablas.length){alert('Esta sección aún no tiene datos para exportar.');return;}
 const filas=[];let head=null;
 tablas.forEach(tb=>{
  // si la tabla está dentro de un grupo por agente, tomamos ese nombre
  const gh=tb.closest('.agrupo')?.querySelector('.agrupo-h');
  let grupo='';
  if(gh){const g=gh.cloneNode(true);g.querySelectorAll('.av-sm,.sum,.cnt').forEach(e=>e.remove());
   grupo=(g.innerText||'').split('·')[0].replace(/\s+/g,' ').trim();}
  const thsAll=[...tb.querySelectorAll('thead th')].map(t=>t.innerText.replace(/\s+/g,' ').trim());
  if(!thsAll.length)return;
  // columnas que no aportan en un CSV (botones y la barra de progreso)
  const usar=thsAll.map((t,i)=>({t,i})).filter(x=>!['ACCIONES','%',''].includes(x.t.toUpperCase()));
  const ths=usar.map(x=>x.t);
  if(!head){head=(grupo?['Agente']:[]).concat(ths);filas.push(head);}
  const filaDe=tr=>{
   const tds=[...tr.children];
   if(tds.length!==thsAll.length)return null;   // salta filas de edición o mensajes
   return (grupo?[grupo]:[]).concat(usar.map(x=>valorCelda(celda(tds[x.i]))));
  };
  [...tb.querySelectorAll('tbody tr')].forEach(tr=>{
   const f=filaDe(tr); if(f&&f.some(v=>v!==''))filas.push(f);
  });
  [...tb.querySelectorAll('tfoot tr')].forEach(tr=>{
   const f=filaDe(tr); if(f)filas.push(f);
  });
 });
 if(filas.length<2){alert('No hay filas para exportar.');return;}
 const hoy=bogotaHoy();
 const titulos={ventas:'Ventas',ftds:"FTDs",prod:'Productividad',pagos:'Ventas pendientes',clientes:'Leads',config:'Configuración'};
 descargarXlsx(filas,titulos[PAGE]||'Datos',`${slug}_${hoy}.xlsx`);
}

function parseCSV(text){
 const rows=[];let i=0,f='',row=[],q=false;
 while(i<text.length){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c==='\r'){}else f+=c;}
  i++;}
 if(f.length||row.length){row.push(f);rows.push(row);}
 return rows;
}
async function loadVentasMeses(){
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/ventas_meses?select=mes,csv_url&order=mes.desc',{headers:HDRS});
  const b=await r.json();VENTAS_URLS={};if(Array.isArray(b))b.forEach(x=>{if((x.csv_url||'').trim())VENTAS_URLS[x.mes]=x.csv_url.trim();});
 }catch(_){VENTAS_URLS={};}
 if(VENTAS_CSV_URL&&!VENTAS_URLS['2026-07'])VENTAS_URLS['2026-07']=VENTAS_CSV_URL; // respaldo julio
}
async function setVentaMesUrl(mes,url){
 await fetch(SUPABASE_URL+'/rest/v1/ventas_meses?on_conflict=mes',{method:'POST',
   headers:{...WHDR,'Prefer':'resolution=merge-duplicates,return=minimal'},
   body:JSON.stringify({mes,csv_url:(url||'').trim(),updated_at:new Date().toISOString()})});
 await loadVentasMeses();
}
async function loadVentas(){
 const url=VENTAS_URLS[VENTAS_MES]||'';
 if(!url){VENTAS='sinmes';return;}
 try{
  const r=await fetch(url);const txt=await r.text();
  const rows=parseCSV(txt).filter(r=>r.some(c=>(c||'').trim()!==''));
  // localizar fila de encabezado: la que contiene "NOMBRE"
  let hi=rows.findIndex(r=>r.some(c=>norm(c)==='nombre'));
  if(hi<0)hi=0;
  const header=rows[hi].map(c=>(c||'').trim());
  const nameIdx=header.findIndex(c=>norm(c)==='nombre');
  const totIdx=header.findIndex(c=>norm(c).includes('total'));
  const prodIdx=[];header.forEach((c,idx)=>{if(idx!==nameIdx&&idx!==totIdx&&c&&idx>nameIdx)prodIdx.push(idx);});
  const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
  const out=[];
  for(let r=hi+1;r<rows.length;r++){
   const row=rows[r];const name=(row[nameIdx]||'').trim();
   if(!name||norm(name)==='total')continue;
   const prods={};let sum=0;
   prodIdx.forEach(idx=>{const v=num(row[idx]);if(v){prods[header[idx]]=(prods[header[idx]]||0)+v;sum+=v;}});
   const total=totIdx>=0?num(row[totIdx]):sum;
   out.push({name,total:total||sum,prods});
  }
  VENTAS=out;
 }catch(e){VENTAS='error';}
}

function ftdSetPeriod(p){FTD_PERIOD=p;renderFtds();}
function inRange(f){
 const hoy=bogotaHoy();
 if(FTD_PERIOD==='hoy')return f===hoy;
 if(FTD_PERIOD==='7'){const d=new Date(hoy);d.setDate(d.getDate()-6);return f>=iso(d)&&f<=hoy;}
 if(FTD_PERIOD==='mes')return f.slice(0,7)===hoy.slice(0,7);
 if(FTD_PERIOD==='rango')return (!FTD_FROM||f>=FTD_FROM)&&(!FTD_TO||f<=FTD_TO);
 if(FTD_PERIOD==='todo')return true;
 return true;
}
function bogotaHoy(){return new Date(Date.now()-5*3600*1000).toISOString().slice(0,10);}
function iso(d){return d.toISOString().slice(0,10);}
function ftdMesesDisponibles(){

 return [...set].sort().reverse();
}

async function guardarFtdManual(){

 const err=$('faErr');
 if(nom.length<2){err.textContent='Escribe el nombre del cliente.';return;}
 if(!ag){err.textContent='Falta el agente.';return;}
 if(!fecha){err.textContent='Elige la fecha del FTD.';return;}
 const id='manual-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
 const row={agente:ag,nombre:nom,telefono:tel||null,fecha_ftd:fecha,ftd:true,origen:'manual',ghl_opportunity_id:id,ghl_contact_id:id};
 err.textContent='Guardando…';
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/leads',{method:'POST',headers:{...WHDR,'Prefer':'return=minimal'},body:JSON.stringify(row)});
  if(!r.ok)throw new Error(await r.text());

 // Panel de clientes que hicieron FTD

 el.innerHTML=kpis+bar+`<div class="panel scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${ROLE==='director'?`<tfoot><tr>${foot}</tr></tfoot>`:''}</table></div>
   ${cliPanel}

 if($('fFrom')){$('fFrom').onchange=e=>{FTD_FROM=e.target.value;renderFtds();};}

}

function bogFecha(iso){return iso?new Date(Date.parse(iso)-5*3600*1000).toISOString().slice(0,10):'';}
function ftdSelIdx(i){const a=FTD_LIST[i]?FTD_LIST[i].a:'';FTD_SEL=(FTD_SEL===a?'':a);renderFtds();}
const MESES_ES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaCorta(d){if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?(parseInt(p[2])+' de '+(MESES_ES[parseInt(p[1])-1]||p[1])):d;}
function ftdClientesPanel(agent,perLbl){
 const rows=LEADSFTD.filter(c=>sameAgent(c.agente,agent)&&inRange(String(c.fecha_ftd).slice(0,10)))
   .sort((a,b)=>String(b.fecha_ftd).localeCompare(String(a.fecha_ftd)));
 const esExt=c=>c.origen==='evento';
 const nExt=rows.filter(esExt).length, nReal=rows.length-nExt;
 const pills=`<span class="pill" style="background:rgba(34,197,94,.13);color:#22c55e">${nReal} FTD · ${perLbl}</span>`
   +(nExt?`<span class="pill" style="background:rgba(148,163,184,.14);color:#94a3b8">${nExt} externos</span>`:'');
 const titulo=ROLE==='director'
   ? `<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px"><b style="font-size:15px">${avatar(agent)}${esc(agent)}</b>${pills}<button class="icobtn" onclick="ftdSelIdx(-1)" style="margin-left:auto">Cerrar ✕</button></div>`
   : `<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px"><b style="font-size:15px">Tus clientes con FTD</b>${pills}</div>`;
 if(!rows.length)return `<div class="panel" style="margin-top:14px">${titulo}<div class="note" style="margin:0">No hay clientes con FTD en este periodo.</div></div>`;
 // filtro por item
 const itemsDe=c=>ITEMS_MAP[c.ghl_contact_id||'']||[];
 const nSin=rows.filter(c=>!itemsDe(c).length).length;
 const cnt=ITEMS_FTD.map(it=>rows.filter(c=>itemsDe(c).includes(it)).length);
 const fchip=(val,txt,n)=>`<div class="chip ${FTD_ITEM_FILTRO===val?'on':''}" onclick="ftdItemFiltro('${val}')">${esc(txt)}${n!=null?` (${n})`:''}</div>`;
 let fbar=`<div class="bar" style="margin-bottom:10px">${fchip('','Todos',rows.length)}`
   +ITEMS_FTD.map((it,k)=>fchip('i'+k,it,cnt[k])).join('')
   +fchip('__none','Sin ítems',nSin)+`</div>`;
 let disp=rows;
 if(FTD_ITEM_FILTRO==='__none')disp=rows.filter(c=>!itemsDe(c).length);
 else if(FTD_ITEM_FILTRO.startsWith('i')){const it=ITEMS_FTD[parseInt(FTD_ITEM_FILTRO.slice(1))];disp=rows.filter(c=>itemsDe(c).includes(it));}
 if(!disp.length)return `<div class="panel" style="margin-top:14px">${titulo}${fbar}<div class="note" style="margin:0">Ningún cliente con ese filtro.</div></div>`;
 const body=disp.map((c,i)=>{
  const wa=(c.telefono||'').replace(/[^0-9]/g,'');
  const tel=c.telefono?(wa?`<a href="https://wa.me/${wa}" target="_blank" style="color:#22c55e;text-decoration:none">${esc(c.telefono)}</a>`:esc(c.telefono)):'<span class="z">—</span>';
  const cid=c.ghl_contact_id||'';const sel=ITEMS_MAP[cid]||[];
  const chips=cid?ITEMS_FTD.map((it,k)=>{const on=sel.includes(it);
    return `<span onclick="toggleItem('${cid}',${k})" style="cursor:pointer;user-select:none;display:inline-block;font-size:11.5px;font-weight:600;padding:4px 9px;margin:2px 3px 2px 0;border-radius:20px;border:1px solid ${on?'#22c55e':'var(--line)'};background:${on?'rgba(34,197,94,.14)':'transparent'};color:${on?'#22c55e':'var(--mut)'}">${on?'✓ ':''}${esc(it)}</span>`;
   }).join(''):'<span class="z">—</span>';
  const tag=esExt(c)?' <span style="font-size:10px;font-weight:700;color:#94a3b8;border:1px solid var(--line);border-radius:20px;padding:2px 7px;margin-left:4px;white-space:nowrap">externo</span>':'';
  return `<tr${esExt(c)?' style="opacity:.82"':''}><td class="rk">${i+1}</td><td class="ag">${avatar(c.nombre||'?')}${esc(c.nombre||'Sin nombre')}${tag}</td><td data-label="Teléfono">${tel}</td><td data-label="Fecha FTD">${fechaCorta(c.fecha_ftd)}</td><td data-label="Ítems">${chips}</td></tr>`;
 }).join('');
 return `<div class="panel scroll" style="margin-top:14px">${titulo}${fbar}
   <table><thead><tr><th>#</th><th>Cliente</th><th>Teléfono</th><th>Fecha FTD</th><th>Ítems</th></tr></thead><tbody>${body}</tbody></table>
   <div class="note" style="margin:12px 0 0">Toca un ítem para marcar el avance de cada cliente: <b>${ITEMS_FTD.join(' · ')}</b>. Se guarda automáticamente.${nExt?` Los marcados como <b>externo</b> vienen del registro del evento y <b>no se suman</b> al conteo de FTD.`:''}</div></div>`;
}
function ftdItemFiltro(v){FTD_ITEM_FILTRO=(FTD_ITEM_FILTRO===v?'':v);renderFtds();}

/* ---------- PRODUCTIVIDAD ---------- */
function minsSince(iso){return iso?Math.floor((Date.now()-Date.parse(iso))/60000):null;}
function agoTxt(m){if(m==null)return 'sin datos';if(m<1)return 'ahora';if(m<60)return 'hace '+m+' min';const h=Math.floor(m/60);if(h<24)return 'hace '+h+'h '+(m%60)+'m';const d=Math.floor(h/24);return 'hace '+d+(d===1?' día':' días')+(h%24?' '+(h%24)+'h':'');}
function prodFecha(f){PROD_FECHA=f;if(PAGE==='prod')showView('prod');renderProd();}
function prodBar(){
 const hoyB=bogotaHoy();const ayer=new Date(Date.parse(hoyB+'T12:00:00Z')-864e5).toISOString().slice(0,10);
 const c=(f,t)=>`<div class="chip ${PROD_FECHA===f?'on':''}" onclick="prodFecha('${f}')">${t}</div>`;
 const otro=PROD_FECHA!=='hoy'&&PROD_FECHA!==ayer;
 return `<div class="bar">${c('hoy','Hoy')}${c(ayer,'Ayer')}
   <input type="date" id="prodDate" max="${hoyB}" value="${otro?PROD_FECHA:''}" onchange="prodFecha(this.value)" style="${otro?'border-color:var(--sig)':''}">
   ${PROD_FECHA!=='hoy'?`<span style="color:var(--mut);font-size:12.5px">Mostrando ${PROD_FECHA}</span>`:''}</div>`;
}
function renderProdHistorico(){
 const el=$('viewProd');
 let src=METRICAS.filter(r=>r.fecha===PROD_FECHA&&r.agente!=='sin asignar'&&!excluidoMetricas(r.agente));
 if(ROLE==='agente')src=src.filter(r=>sameAgent(r.agente,ME));
 if(!src.length){el.innerHTML=prodBar()+'<div class="setup"><h3>Sin datos de ese día</h3>No hay actividad registrada para '+PROD_FECHA+'. Solo se guarda el historial del mes en curso.</div>';return;}
 src.sort((a,b)=>b.registros-a.registros||b.ftd-a.ftd);
 const act=src.filter(r=>r.registros>0).length,sin=src.filter(r=>r.registros===0).length;
 const tl=src.reduce((s,r)=>s+r.leads,0),tr=src.reduce((s,r)=>s+r.registros,0),tf=src.reduce((s,r)=>s+r.ftd,0);
 let kpis=`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-green">${ICONS.check}</div><div class="kpi-l">Activos ese día</div></div><div class="kpi-n" style="color:#4ade80">${act}</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic">${ICONS.alert}</div><div class="kpi-l">Sin registros</div></div><div class="kpi-n" style="color:#f87171">${sin}</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-blue">${ICONS.tray}</div><div class="kpi-l">Leads / Reg / FTD</div></div><div class="kpi-n" style="font-size:20px">${tl} · ${tr} · ${tf}</div></div>
  </div>`;
 let body='';
 src.forEach((r,i)=>{
  const alerta=r.registros===0;
  body+=`<tr class="${alerta?'alert-row':''}"><td class="rk">${i+1}</td><td class="ag">${avatar(r.agente)}${esc(r.agente)}</td>
   <td class="b" data-label="Leads">${r.leads}</td><td class="g" data-label="Registros">${r.registros}</td>
   <td data-label="FTD" style="color:#4ade80;font-weight:700">${r.ftd}</td>
   <td data-label="Estado" style="text-align:center">${alerta
     ?'<span class="pill" style="background:rgba(239,68,68,.13);color:#f87171"><span class="dot" style="background:#ef4444"></span>Sin registros</span>'
     :'<span class="pill" style="background:rgba(34,197,94,.13);color:#22c55e"><span class="dot" style="background:#22c55e"></span>Activo</span>'}</td></tr>`;
 });
 el.innerHTML=kpis+prodBar()+`<div class="panel scroll"><table><thead><tr><th>#</th><th>Agente</th><th>Leads</th><th>Registros</th><th>FTD</th><th style="text-align:center">Estado</th></tr></thead><tbody>${body}</tbody></table></div>
   <div class="note">Actividad del <b>${PROD_FECHA}</b>. <b>Activo</b> = hizo al menos un registro ese día. El detalle de "última actividad" solo está disponible en el día de hoy.</div>`;
}
function renderProd(){
 const el=$('viewProd');
 if(PROD_FECHA!=='hoy'){renderProdHistorico();return;}
 if(!ACTIVIDAD.length){el.innerHTML='<div class="loading">Cargando actividad… (se llena con la sincronización de GoHighLevel)</div>';return;}
 let rows=ACTIVIDAD.filter(x=>x.agente&&x.agente!=='sin asignar'&&!excluidoMetricas(x.agente));
 if(ROLE==='agente')rows=rows.filter(x=>sameAgent(x.agente,ME));
 rows=rows.map(x=>{
  const reg=x.registros_hoy||0;
  const mins=minsSince(x.ultima_actividad_at); // minutos desde la última actividad (aunque sea de días atrás)
  let estado,rank;
  if(reg>0){estado='activo';rank=2;}          // registró hoy
  else if(mins!=null&&mins>=INACT_MIN){estado='inactivo';rank=0;} // sin registrar hoy → alerta
  else{estado='inactivo';rank=1;}
  return {...x,reg,mins,estado,rank};
 });
 rows.sort((a,b)=>a.rank-b.rank || (b.mins||0)-(a.mins||0) || b.reg-a.reg);
 const activos=rows.filter(r=>r.estado==='activo').length;
 const inactHoy=rows.filter(r=>r.reg===0).length;
 const critico=rows.filter(r=>r.reg===0 && r.mins!=null && r.mins>=1440).length; // +1 día sin actividad
 let kpis=`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-green">${ICONS.check}</div><div class="kpi-l">Activos hoy</div></div><div class="kpi-n" style="color:#4ade80">${activos}</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic">${ICONS.alert}</div><div class="kpi-l">Sin registros hoy</div></div><div class="kpi-n" style="color:#f87171">${inactHoy}</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-gold">${ICONS.clock}</div><div class="kpi-l">+1 día inactivos</div></div><div class="kpi-n" style="color:#facc15">${critico}</div></div>
  </div>`;
 const badge=r=>{
  if(r.estado==='activo')return '<span class="pill" style="background:rgba(34,197,94,.13);color:#22c55e"><span class="dot" style="background:#22c55e"></span>Activo</span>';
  const col=(r.mins!=null&&r.mins>=1440)?['#ef4444','rgba(239,68,68,.13)']:['#eab308','rgba(234,179,8,.13)'];
  return `<span class="pill" style="background:${col[1]};color:${col[0]}"><span class="dot" style="background:${col[0]}"></span>Inactivo</span>`;
 };
 let body='';
 rows.forEach((r,i)=>{
  const rojo=r.reg===0 && r.mins!=null && r.mins>=1440;
  const cls=(rojo?'alert-row':'')+(norm(r.agente)===norm(ME)?' me':'');
  const actCol=r.reg>0?'#4ade80':(rojo?'#f87171':'var(--ink2)');
  body+=`<tr class="${cls}"><td class="rk">${i+1}</td><td class="ag">${avatar(r.agente)}${esc(r.agente)}</td>
   <td class="b" data-label="Leads hoy">${r.leads_hoy||0}</td><td class="g" data-label="Registros hoy">${r.reg}</td>
   <td data-label="Última actividad" style="color:${actCol};font-weight:600">${agoTxt(r.mins)}</td>
   <td data-label="Estado" style="text-align:center">${badge(r)}</td></tr>`;
 });
 el.innerHTML=kpis+prodBar()+`<div class="panel scroll"><table><thead><tr><th>#</th><th>Agente</th><th>Leads hoy</th><th>Registros hoy</th><th>Última actividad</th><th style="text-align:center">Estado</th></tr></thead><tbody>${body}</tbody></table></div>
   <div class="note"><b>Última actividad</b> = cuánto hace que el agente registró o hizo un FTD por última vez (aunque haya sido hace días). <b style="color:#22c55e">Activo</b> = ya registró hoy · <b style="color:#eab308">Inactivo</b> = sin registro hoy · <b style="color:#f87171">rojo</b> = +1 día sin actividad. Te llega un correo cuando un agente pasa ${INACT_MIN} min sin registrar en horario laboral (8am–11pm).</div>`;
}

/* ---------- PAGOS ---------- */
function fdate(f){if(!f)return '—';const d=new Date(f+'T00:00:00');return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'});}
function pTag(p){if(p.estado==='pagado')return '<span class="tag pagado">Pagado</span>';return '<span class="tag '+(p.tipo==='posible'?'posible':'agendado')+'">'+(p.tipo==='posible'?'Posible':'Agendado')+'</span>';}

 if(PRODUCTOS_DB.length)return PRODUCTOS_DB.filter(p=>p.activo).map(p=>({v:p.id,label:p.nombre,precio:p.precio,

 } else {

  const agsAll=[...new Set([...PAGOS.map(p=>p.agente),...AGENTES.map(a=>a.nombre)].filter(a=>a&&!excluido(a)))].sort();

  const formDir=`<div class="pform">

    <div class="fg" id="pgOtroWrap" style="display:none"><label>Nombre (otro)</label><input id="pgOtro" placeholder="¿Qué vendió?"></div>
    <div class="fg"><label>Monto</label><input id="pgMonto" type="number" placeholder="0" style="width:100px"></div>
    <div class="fg"><label>Abono</label><input id="pgAbono" type="number" placeholder="0" style="width:100px"></div>

  onProdChange();
 }
}

/* ---------- CLIENTES (leads) ---------- */
function cliFiltro(f){CLI_FILTRO=f;renderClientes();}
function cliPeriodo(p){CLI_PERIODO=p;renderClientes();}
function cliAgente(a){CLI_AGENTE=a;renderClientes();}
let LEAD_EDIT=null;
function editarLead(id){LEAD_EDIT=(LEAD_EDIT===id?null:id);renderClientes();}
function guardarLead(id){
 const g=k=>{const e=document.getElementById(k+'_'+id);return e?e.value:null;};
 patchLead(id,{nombre:g('leN'),telefono:g('leT'),agente:g('leA'),notas:g('leO'),fijado:true});
 LEAD_EDIT=null;
}
function descartarLead(id,val){patchLead(id,{descartado:val});}
function hs(iso){return iso?(Date.now()-Date.parse(iso))/3600000:null;}
function hTxt(h){if(h==null)return '—';if(h<1)return Math.max(1,Math.round(h*60))+' min';if(h<24)return Math.floor(h)+'h';const d=Math.floor(h/24);return d+(d===1?' día':' días');}
function renderClientes(){
 const el=$('viewClientes');
 if(!CLIENTES.length){el.innerHTML='<div class="loading">Cargando clientes… (se llena con la sincronización de GoHighLevel)</div>';return;}
 let base=CLIENTES.filter(c=>c.agente&&!excluido(c.agente));
 if(ROLE==='agente')base=base.filter(c=>sameAgent(c.agente,ME));
 const hoyB=bogotaHoy();
 if(CLI_PERIODO==='hoy')base=base.filter(c=>c.llegada_at&&new Date(Date.parse(c.llegada_at)-5*3600*1000).toISOString().slice(0,10)===hoyB);
 else if(CLI_PERIODO==='7')base=base.filter(c=>c.llegada_at&&(Date.now()-Date.parse(c.llegada_at))<=7*24*3600*1000);
 const agentesLista=[...new Set(base.map(c=>c.agente))].sort();
 if(CLI_AGENTE!=='todos'&&agentesLista.includes(CLI_AGENTE))base=base.filter(c=>c.agente===CLI_AGENTE);
 base=base.map(c=>{
  const hLleg=hs(c.llegada_at),hReg=hs(c.registrado_at);
  let est,rank,horas;
  if(c.ftd_at){est='ftd';rank=3;horas=hLleg;}
  else if(c.registrado_at){est='reg';rank=(hReg>=20?0:hReg>=10?1:2);horas=hReg;}
  else{est='nada';rank=(hLleg>=20?0:hLleg>=10?1:2);horas=hLleg;}
  return {...c,est,rank,horas,hLleg};
 });
 let list=base.slice();
 if(CLI_FILTRO==='riesgo')list=list.filter(c=>c.est!=='ftd'&&c.horas>=4);
 else if(CLI_FILTRO==='nada')list=list.filter(c=>c.est==='nada');
 else if(CLI_FILTRO==='reg')list=list.filter(c=>c.est==='reg');
 else if(CLI_FILTRO==='ftd')list=list.filter(c=>c.est==='ftd');
 list.sort((a,b)=>a.rank-b.rank||(b.horas||0)-(a.horas||0));
 const nFtd=base.filter(c=>c.est==='ftd').length,nReg=base.filter(c=>c.est==='reg').length,
       nNada=base.filter(c=>c.est==='nada').length,nRiesgo=base.filter(c=>c.est!=='ftd'&&c.horas>=20).length;
 let kpis=`<div class="kpis" style="grid-template-columns:repeat(4,1fr)">
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-blue">${ICONS.tray}</div><div class="kpi-l">Leads ${CLI_PERIODO==='hoy'?'(hoy)':CLI_PERIODO==='7'?'(7 días)':'(mes)'}</div></div><div class="kpi-n">${base.length}</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-violet">${ICONS.check}</div><div class="kpi-l">Registrados sin FTD</div></div><div class="kpi-n" style="color:#c4b5fd">${nReg}</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-green">${ICONS.coins}</div><div class="kpi-l">Con FTD</div></div><div class="kpi-n" style="color:#4ade80">${nFtd}</div></div>
   <div class="kpi"><div class="kpi-top"><div class="kpi-ic">${ICONS.alert}</div><div class="kpi-l">Críticos (+20h)</div></div><div class="kpi-n" style="color:#f87171">${nRiesgo}</div></div>
  </div>`;
 const pchip=(p,t)=>`<div class="chip ${CLI_PERIODO===p?'on':''}" onclick="cliPeriodo('${p}')">${t}</div>`;
 const selAg=ROLE==='director'?`<select onchange="cliAgente(this.value)" style="padding:9px 11px;border:1px solid ${CLI_AGENTE==='todos'?'var(--line)':'var(--sig)'};border-radius:10px;background:var(--white);font-family:'Inter';font-size:13px;margin-left:auto">
   <option value="todos">Todos los agentes</option>${agentesLista.map(a=>`<option value="${esc(a)}" ${CLI_AGENTE===a?'selected':''}>${esc(a)}</option>`).join('')}</select>`:'';
 let bar=`<div class="bar" style="margin-bottom:10px">${pchip('hoy','Hoy')}${pchip('7','7 días')}${pchip('mes','Todo el mes')}${selAg}</div>`;
 const badge=c=>{
  if(c.est==='ftd')return '<span class="pill" style="background:rgba(34,197,94,.13);color:#22c55e"><span class="dot" style="background:#22c55e"></span>FTD</span>';
  const crit=c.horas>=20,med=c.horas>=10,warn=c.horas>=4;
  const col=crit?['#ef4444','rgba(239,68,68,.13)']:med?['#f97316','rgba(249,115,22,.13)']:warn?['#eab308','rgba(234,179,8,.13)']:['#60a5fa','rgba(59,130,246,.13)'];
  const txt=c.est==='reg'?'Registrado · falta FTD':'Sin registro';
  return `<span class="pill" style="background:${col[1]};color:${col[0]}"><span class="dot" style="background:${col[0]}"></span>${txt}</span>`;
 };
 const MAXROWS=400;
 const dir=ROLE==='director';
 const todosAg=[...new Set(CLIENTES.map(c=>c.agente).filter(a=>a&&!excluido(a)))].sort();
 const fila=c=>{
  const wa=(c.telefono||'').replace(/[^0-9]/g,'');
  const crit=c.est!=='ftd'&&c.horas>=20;
  const tel=c.telefono?(wa?`<a href="https://wa.me/${wa}" target="_blank" style="color:#22c55e;text-decoration:none">${esc(c.telefono)}</a>`:esc(c.telefono)):'<span class="z">—</span>';
  const nCols=dir?7:6;
  if(dir&&LEAD_EDIT===c.contact_id){
   return `<tr class="me"><td colspan="${nCols}" style="text-align:left">
     <div class="pform" style="margin:0;background:transparent;border:none;padding:6px 0">
      <div class="fg cli"><label>Nombre</label><input id="leN_${c.contact_id}" value="${esc(c.nombre||'')}"></div>
      <div class="fg"><label>Teléfono</label><input id="leT_${c.contact_id}" value="${esc(c.telefono||'')}"></div>
      <div class="fg"><label>Agente</label><select id="leA_${c.contact_id}">${todosAg.map(a=>`<option value="${esc(a)}" ${a===c.agente?'selected':''}>${esc(a)}</option>`).join('')}</select></div>
      <div class="fg" style="flex:1;min-width:170px"><label>Notas internas</label><input id="leO_${c.contact_id}" value="${esc(c.notas||'')}" placeholder="Observaciones…"></div>
      <button class="addbtn" onclick="guardarLead('${c.contact_id}')">Guardar</button>
      <button class="icobtn" onclick="editarLead('${c.contact_id}')">Cancelar</button>
     </div></td></tr>`;
  }
  const desc=c.descartado;
  return `<tr class="${desc?'':(crit?'alert-row':'')}" style="${desc?'opacity:.45':''}">
   <td class="ag">${esc(c.nombre||'Sin nombre')}${c.fijado?' <span title="Editado a mano: la sincronización no lo pisa" style="color:var(--sigd)">✎</span>':''}${c.notas?`<div style="font-size:11.5px;color:var(--mut);font-weight:400">${esc(c.notas)}</div>`:''}</td>
   <td data-label="Teléfono">${tel}</td>
   <td data-label="Agente" style="color:var(--ink2);white-space:nowrap">${avatar(c.agente)}${esc(c.agente)}</td>
   <td data-label="Llegó hace" style="color:var(--ink2)">${hTxt(c.hLleg)}</td>
   <td data-label="Sin avanzar" style="color:${c.est==='ftd'?'#4ade80':(c.horas>=20?'#f87171':c.horas>=10?'#fb923c':'var(--ink2)')};font-weight:700">${c.est==='ftd'?'—':hTxt(c.horas)}</td>
   <td data-label="Estado" style="text-align:center">${desc?'<span class="pill" style="background:rgba(148,163,184,.13);color:#94a3b8"><span class="dot" style="background:#64748b"></span>Descartado</span>':badge(c)}</td>
   ${dir?`<td data-label="Acciones" style="text-align:right;white-space:nowrap">
     <button class="icobtn" title="Editar" onclick="editarLead('${c.contact_id}')">✎</button>
     <button class="icobtn ${desc?'':'del'}" title="${desc?'Reactivar':'Descartar'}" onclick="descartarLead('${c.contact_id}',${!desc})">${desc?'↺':'✕'}</button></td>`:''}</tr>`;
 };
 const thead=`<thead><tr><th>Cliente</th><th>Teléfono</th><th>Agente</th><th>Llegó hace</th><th>Sin avanzar</th><th style="text-align:center">Estado</th>${dir?'<th style="text-align:right">Acciones</th>':''}</tr></thead>`;
 const seccion=(titulo,color,rows,vacio)=>{
  const head=`<div style="display:flex;align-items:center;gap:10px;margin:18px 0 8px"><span style="width:9px;height:9px;border-radius:50%;background:${color};display:inline-block"></span><b style="font-size:15px;letter-spacing:.02em">${titulo}</b><span class="pill" style="background:${color}22;color:${color}">${rows.length}</span></div>`;
  if(!rows.length)return head+`<div class="note" style="margin:0">${vacio}</div>`;
  const extra=rows.length>MAXROWS?`<div class="note" style="margin:8px 0 0">Mostrando los <b>${MAXROWS}</b> más urgentes de ${rows.length}.</div>`:'';
  return head+`<div class="panel scroll"><table>${thead}<tbody>${rows.slice(0,MAXROWS).map(fila).join('')}</tbody></table></div>${extra}`;
 };
 const ordUrg=(a,b)=>a.rank-b.rank||(b.horas||0)-(a.horas||0);
 const grpFtd=base.filter(c=>c.est==='ftd').sort((a,b)=>(b.hLleg||0)-(a.hLleg||0));
 const grpReg=base.filter(c=>c.est==='reg').sort(ordUrg);
 const grpNada=base.filter(c=>c.est==='nada').sort(ordUrg);
 el.innerHTML=kpis+bar
   +seccion('FTD','#22c55e',grpFtd,'Sin clientes con FTD en este periodo.')
   +seccion('REGISTRO SIN FTD','#a855f7',grpReg,'Ningún registrado pendiente de FTD.')
   +seccion('SIN REGISTRO','#ef4444',grpNada,'Todos los leads están al menos registrados.')
   +`<div class="note"><b>Sin avanzar</b> = tiempo desde que llegó (si no tiene registro) o desde que se registró (si falta el FTD). Se envían avisos automáticos al agente a las <b>4h</b>, <b>10h</b> (segundo aviso) y <b>20h</b> (está a 4h de morir), tanto para leads sin registro como para registrados sin FTD. Los avisos aplican a leads de los últimos 3 días; aquí puedes ver todo el mes.</div>`;
}

     <div class="fg"><label>Conectar mes nuevo</label><input id="vmNuevoMes" type="month" value="${hoyMes}"></div>
     <div class="fg" style="flex:1;min-width:220px"><label>Enlace CSV publicado</label><input id="vmNuevoUrl" placeholder="https://docs.google.com/.../pub?output=csv"></div>
     <button class="addbtn" onclick="agregarVentaMes()">+ Conectar</button>
   </div>
   <div class="panel scroll"><table><thead><tr><th>Mes</th><th>Enlace CSV de la hoja</th><th style="text-align:right">Guardar</th></tr></thead><tbody>${vmBody}</tbody></table></div>
   <div class="note">Cada mes usa su propia hoja. Publica el sheet del mes como <b>CSV</b> (Archivo → Compartir → Publicar en la web → CSV) y pega aquí el enlace. En la sección <b>Ventas</b> eliges el mes; el mes en curso arranca en <b>0</b> hasta que conectes su hoja.</div>`;
 el.innerHTML=kpis+form+`<div class="panel scroll"><table><thead><tr><th>Membresía</th><th>Precio</th><th>Comisión agente</th><th>Tipo</th><th>Columna Sheet</th><th style="text-align:right">Acciones</th></tr></thead><tbody>${body}</tbody></table></div>
   <div class="note"><b>Comisión agente</b> = cuánto gana el agente por cada venta de esa membresía (valor fijo en USD). <b>Columna Sheet</b> = el nombre exacto de la columna en tu Google Sheet de facturación; así calculo cuántas unidades vendió cada agente y su comisión. El botón ● desactiva un producto (deja de aparecer al registrar ventas, pero no borra el histórico). Todo se guarda al instante.</div>
   ${vmPanel}`;
}
async function guardarVentaMes(m){
 const e=document.getElementById('vm_'+m);const u=e?e.value:'';
 await setVentaMesUrl(m,u);
 if(m===VENTAS_MES){VENTAS=null;renderVentas();await loadVentas().catch(()=>{VENTAS='error';});renderVentas();}
 renderConfig();
}
async function agregarVentaMes(){
 const m=($('vmNuevoMes').value||'').slice(0,7);const u=$('vmNuevoUrl').value||'';
 if(!/^\d{4}-\d{2}$/.test(m)){alert('Elige un mes válido.');return;}
 await setVentaMesUrl(m,u);$('vmNuevoUrl').value='';
 if(m===VENTAS_MES){VENTAS=null;await loadVentas().catch(()=>{VENTAS='error';});renderVentas();}
 renderConfig();
}

/* auto-login */
if(ROLE&&ME){startApp();}
</script>
</body></html>
