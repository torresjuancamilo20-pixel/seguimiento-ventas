<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBS · Conviértete en Miembro Oro (loop, transparente)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');
/* Fondo TRANSPARENTE para OBS */
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Montserrat',sans-serif}
*{box-sizing:border-box}

.stage{position:fixed;inset:0;display:grid;place-items:center}
.plate{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:14px;text-align:center}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-8px)}}

/* logo arriba */
.logo{font-weight:800;font-size:28px;letter-spacing:-.04em;color:#fff4cf;opacity:.95}
.logo small{font-weight:600;font-size:.4em;letter-spacing:.34em;vertical-align:super;margin-left:4px;color:#e0a800}

/* "CONVIÉRTETE EN" */
.kick{font-weight:700;font-size:clamp(16px,2.6vw,26px);letter-spacing:.42em;text-transform:uppercase;color:#f3e4b0;padding-left:.42em;
  text-shadow:0 2px 12px rgba(0,0,0,.5)}

/* "MIEMBRO ORO" con brillo dorado en loop */
.title{font-weight:900;font-size:clamp(50px,10vw,132px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;
  background:linear-gradient(100deg,#b8860b 0%,#fff6d5 20%,#f5c518 38%,#fff2c2 50%,#e0a800 66%,#ffe98a 82%,#b8860b 100%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.6));
  animation:shimmer 4.5s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* línea decorativa */
.rule{display:flex;align-items:center;gap:14px;opacity:.95}
.rule .ln{width:120px;height:2px;background:linear-gradient(90deg,transparent,#e0a800);border-radius:2px}
.rule .ln.r{background:linear-gradient(90deg,#e0a800,transparent)}
.rule .dot{width:9px;height:9px;border-radius:50%;background:#f5c518;box-shadow:0 0 14px rgba(245,197,24,.9);animation:dot 2.4s ease-in-out infinite}
@keyframes dot{50%{opacity:.4;transform:scale(.7)}}

/* botón/pill con pulso */
.pill{margin-top:4px;padding:14px 30px;border-radius:40px;font-weight:800;font-size:clamp(15px,2.4vw,22px);letter-spacing:.06em;text-transform:uppercase;color:#1a1400;
  background:linear-gradient(180deg,#ffe98a,#f5c518);box-shadow:0 10px 30px rgba(245,197,24,.35),inset 0 1px 0 rgba(255,255,255,.7);
  animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(245,197,24,.35)}50%{transform:scale(1.045);box-shadow:0 14px 40px rgba(245,197,24,.55)}}

@media(prefers-reduced-motion:reduce){.title,.dot,.breathe,.pill{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="plate breathe">
    <div class="logo">NX<small>NEXUS</small></div>
    <div class="kick">Conviértete en</div>
    <div class="title">Miembro<br>Oro</div>
    <div class="rule"><span class="ln"></span><span class="dot"></span><span class="ln r"></span></div>
    <div class="pill">Únete ahora</div>
  </div>
</div>
</body>
</html>
