<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eva — Reel "¿Adivinas cuánto le sobró?" (32,5 s, vertical)</title>
<style>
@font-face{font-family:'Montserrat';font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:700;src:url(fonts/playfair-display-latin-700-normal.woff2) format('woff2')}
:root{--bg:#0B0712;--panel:#15101F;--panel2:#1B1428;--brand:#E24BD8;--brand2:#A855F7;--rosa:#F06CE0;--magenta:#C026D3;--txt:#F3EEFB;--muted:#A99FB8;--muted2:#6E6480;--ok:#22C55E;--bad:#EF4757;--save:#F5A623;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Montserrat',sans-serif;color:var(--txt)}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden;background:radial-gradient(1000px 900px at 50% 38%,#2a0f33,var(--bg) 70%)}
.full{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.mag{background:radial-gradient(1000px 800px at 85% 0%,var(--rosa),transparent 60%),radial-gradient(1100px 1100px at 0% 100%,#7c1fb0,transparent 65%),linear-gradient(160deg,var(--brand),var(--magenta) 45%,#6d1aa8)}
@keyframes vis{0%{opacity:1}100%{opacity:1}}
.pop{display:inline-block;opacity:0;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(1.8);filter:blur(10px)}60%{opacity:1;filter:none}100%{opacity:1;transform:none}}
.up{opacity:0;animation:up .4s cubic-bezier(.2,.9,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.grad{background:linear-gradient(120deg,var(--rosa),var(--brand) 55%,var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grain{position:absolute;inset:-200px;z-index:90;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-40px,20px)}50%{transform:translate(30px,-30px)}75%{transform:translate(-20px,-40px)}100%{transform:translate(0,0)}}
.shake{animation:shk .4s ease-out both}
@keyframes shk{0%{transform:none}20%{transform:translate(-18px,6px) rotate(-1deg)}45%{transform:translate(14px,-6px) rotate(.8deg)}70%{transform:translate(-8px,3px)}100%{transform:none}}
.wm{position:absolute;right:-380px;bottom:-60px;height:1500px;opacity:.07;z-index:0}

.say{font-size:96px;font-weight:900;letter-spacing:-3px;line-height:1.05}
.big{font-size:170px;font-weight:900;letter-spacing:-7px;line-height:.92}
.lbl{font-size:30px;font-weight:900;letter-spacing:8px;color:var(--rosa)}
.chip{display:inline-flex;align-items:center;gap:26px;margin-top:26px;padding:30px 44px;border-radius:30px;background:var(--panel2);border:2px solid rgba(239,71,87,.45);font-size:56px;font-weight:800}
.chip.ok{border-color:rgba(34,197,94,.5)}
.x{width:70px;height:70px;border-radius:50%;background:rgba(239,71,87,.18);position:relative;flex:0 0 auto}
.x::before,.x::after{content:"";position:absolute;left:17px;top:32px;width:36px;height:7px;border-radius:4px;background:var(--bad);transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}
.v{width:70px;height:70px;border-radius:50%;background:rgba(34,197,94,.18);position:relative;flex:0 0 auto}
.v::after{content:"";position:absolute;left:21px;top:14px;width:18px;height:32px;border:solid var(--ok);border-width:0 8px 8px 0;transform:rotate(45deg)}
.strike{position:relative}
.strike::after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:8px;border-radius:4px;background:var(--bad);transform-origin:left;animation:tach .3s ease-out both;animation-delay:inherit}
@keyframes tach{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;width:920px;margin-top:50px}
.d{height:118px;border-radius:24px;border:3px solid rgba(169,159,184,.3);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:var(--muted2);background:rgba(21,16,31,.8);position:relative;overflow:hidden}
.d i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;background:linear-gradient(135deg,var(--rosa),var(--magenta) 55%,var(--brand2));opacity:0;animation:fill .25s cubic-bezier(.2,1.6,.4,1) both}
@keyframes fill{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.cnt{position:relative;height:150px;width:920px;margin-top:20px}
.cnt span{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center}
.cnt b{font-size:120px;font-weight:900;letter-spacing:-4px;color:var(--save)}
.dia{position:relative;height:70px;width:600px}
.dia span{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;letter-spacing:4px;color:var(--muted)}
@keyframes win{0%,100%{opacity:1}}
.logo{display:flex;align-items:baseline}
.logo .E{font-family:'Playfair Display';font-weight:700;font-size:250px;line-height:.8;color:var(--bg)}
.logo .va{font-weight:700;font-size:126px;letter-spacing:-4px;margin-left:-4px;color:#fff}
.pill{display:inline-block;margin-top:56px;font-size:56px;font-weight:800;background:var(--bg);color:#fff;padding:34px 64px;border-radius:999px;box-shadow:0 24px 60px rgba(40,0,50,.45)}
.pill span{color:var(--rosa)}
.phone{width:760px;border-radius:44px;background:var(--panel);border:2px solid var(--line);padding:44px;margin-top:60px;text-align:left;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.phone .t{font-size:32px;font-weight:800;color:var(--muted);letter-spacing:2px}
.phone .n{font-size:110px;font-weight:900;letter-spacing:-4px;color:var(--save);margin-top:10px}
.phone .bar{height:34px;border-radius:999px;background:var(--panel2);margin-top:24px;overflow:hidden}
.phone .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--rosa),var(--brand) 60%,var(--brand2));animation:w60 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes w60{to{width:60%}}
.phone .k{display:flex;justify-content:space-between;font-size:32px;font-weight:700;color:var(--muted);margin-top:18px}
.perfil{display:flex;align-items:center;gap:36px;width:900px;margin-top:50px;padding:40px;border-radius:40px;background:var(--panel);border:2px solid var(--line);text-align:left}
.av{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,var(--rosa),var(--brand2));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:700;font-size:80px;color:#fff;flex:0 0 auto}
.perfil .nm{font-size:56px;font-weight:900}.perfil .dt{font-size:34px;font-weight:600;color:var(--muted);margin-top:6px}
.ing{font-size:130px;font-weight:900;letter-spacing:-5px;color:var(--ok);margin-top:40px}
.lista{width:900px;margin-top:40px}
.it{display:flex;justify-content:space-between;align-items:center;padding:26px 34px;margin-top:14px;border-radius:26px;background:var(--panel2);font-size:46px;font-weight:800}
.it span{color:var(--bad);font-weight:900}
.op{display:flex;align-items:center;gap:30px;width:860px;margin-top:26px;padding:30px 40px;border-radius:30px;background:var(--panel2);border:3px solid rgba(255,255,255,.12);font-size:60px;font-weight:900;text-align:left}
.op b{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--rosa),var(--magenta));font-size:48px;flex:0 0 auto}
.cd{position:relative;width:500px;height:420px;margin-top:20px}
.cd span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:400px;font-weight:900;letter-spacing:-10px;opacity:0}
@keyframes cdn{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.8)}}
.res{font-size:170px;font-weight:900;letter-spacing:-6px;color:var(--bad)}
.rows{width:900px;margin-top:50px;border-radius:36px;background:var(--panel);border:2px solid var(--line);padding:30px 40px;text-align:left}
.rw{margin:18px 0}
.rw .r{display:flex;justify-content:space-between;font-size:38px;font-weight:800}.rw .r span{color:var(--muted)}
.rw .b{height:26px;border-radius:999px;background:var(--panel2);margin-top:12px;overflow:hidden}
.rw .b i{display:block;height:100%;width:0;border-radius:999px;background:var(--muted2);animation:wb .8s cubic-bezier(.2,.8,.2,1) both}
.rw.hot{position:relative;margin:24px -20px;padding:16px 20px;border-radius:24px;border:3px solid var(--brand);box-shadow:0 0 50px rgba(226,75,216,.45)}
.rw.hot .b i{background:linear-gradient(90deg,var(--rosa),var(--brand) 60%,var(--brand2))}
@keyframes wb{to{width:var(--w)}}
.pct{position:absolute;left:250px;top:-30px;font-size:34px;font-weight:900;background:var(--save);color:var(--bg);padding:8px 20px;border-radius:999px;transform:rotate(3deg)}
.ej{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:26px;font-weight:700;color:var(--muted2);letter-spacing:2px}
</style>
</head>
<body>
<div id="root"></div>
<div class="grain"></div>
<script>
const B = 2.5;
const fmt = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('es-CO').replace(/,/g, '.');
const sc = (i, cls, inner, dur = B, extra = '') => `<div class="scene ${cls}" style="animation:vis ${dur}s linear ${i * B}s forwards;${extra}">${inner}</div>`;
// Caso de ejemplo (inventado): ingreso 3.000.000, gastos 3.140.000
const G = [['Arriendo', 1100000], ['Mercado', 550000], ['Transporte', 240000], ['Servicios y celular', 260000], ['Domicilios', 540000], ['Salidas', 380000], ['Suscripciones', 70000]];
const TOT = G.reduce((a, g) => a + g[1], 0), ING = 3000000;
let h = '';
h += sc(0, 'full mag', `<img class="wm" src="marca/eva-silueta-blanca.svg">
  <div class="lbl pop" style="animation-delay:.1s;color:#fff;position:relative">JUEGA CON EVA</div>
  <div class="say pop" style="animation-delay:.3s;margin-top:30px;font-size:120px;position:relative">¿Adivinas</div>
  <div class="say pop" style="animation-delay:.75s;font-size:120px;position:relative;color:var(--bg)">cuánto le sobró?</div>`);
h += sc(1, 'full', `<div class="perfil up" style="animation-delay:${B + .05}s"><div class="av">V</div><div><div class="nm">Valentina, 27</div><div class="dt">Bogotá · empleada</div></div></div>
  <div class="lbl up" style="animation-delay:${B + .5}s;margin-top:60px;color:var(--muted)">GANA AL MES</div>
  <div class="ing pop" style="animation-delay:${B + .8}s">${fmt(ING)}</div>`);
const it = (g, d) => `<div class="it drop" style="animation-delay:${d}s">${g[0]}<span>-${fmt(g[1]).slice(0)}</span></div>`;
h += sc(2, 'full', `<div class="lbl up" style="animation-delay:${2 * B + .05}s">SUS GASTOS DEL MES</div><div class="lista">${G.slice(0, 3).map((g, k) => it(g, 2 * B + .3 + k * .55)).join('')}</div>`);
h += sc(3, 'full', `<div class="lbl" style="opacity:1">SUS GASTOS DEL MES</div><div class="lista">${G.slice(0, 3).map(g => it(g, 0)).join('')}${G.slice(3).map((g, k) => it(g, 3 * B + .2 + k * .5)).join('')}</div>`);
h += sc(4, 'full', `<div class="say up" style="animation-delay:${4 * B + .05}s;font-size:84px">¿Cuánto crees<br><span class="grad">que le sobró?</span></div>
  ${[['A', '$500.000'], ['B', '$200.000'], ['C', '$0']].map((o, k) => `<div class="op drop" style="animation-delay:${4 * B + .5 + k * .35}s"><b>${o[0]}</b>${o[1]}</div>`).join('')}
  <div class="say up" style="animation-delay:${4 * B + 1.6}s;font-size:40px;color:var(--muted);margin-top:40px;letter-spacing:0;white-space:nowrap">Escoge antes de que se acabe el tiempo</div>`);
h += sc(5, 'full', `<div class="say up" style="animation-delay:${5 * B + .05}s;font-size:70px">Piénsalo bien…</div>
  <div class="cd">${[3, 2, 1].map((n, k) => `<span class="grad" style="animation:cdn .8s linear ${5 * B + .25 + k * .75}s both">${n}</span>`).join('')}</div>`);
h += sc(6, 'full', `<div class="lbl up" style="animation-delay:${6 * B + .05}s;color:var(--bad)">NINGUNA. LE FALTARON</div>
  <div class="shake" style="animation-delay:${6 * B + .3}s"><div class="res pop" style="animation-delay:${6 * B + .3}s;margin-top:30px">${fmt(ING - TOT)}</div></div>
  <div class="up" style="animation-delay:${6 * B + 1}s;font-size:44px;font-weight:700;color:var(--muted);margin-top:30px">Gastó ${fmt(TOT)} de ${fmt(ING)}</div>`, B, 'background:radial-gradient(900px 900px at 50% 45%,#3a0c14,var(--bg) 70%)');
h += sc(7, 'full', `<div class="say up" style="animation-delay:${7 * B + .05}s;font-size:110px">Y no sabía<br><span style="color:var(--bad)">por qué.</span></div>`);
const max = Math.max(...G.map(g => g[1]));
const filas = (t0, hot) => [...G].sort((a, b) => b[1] - a[1]).slice(0, 5).map((g, k) => `<div class="rw ${hot && g[0] === 'Domicilios' ? 'hot' : ''}">${hot && g[0] === 'Domicilios' ? `<div class="pct pop" style="animation-delay:${t0 + .5}s">${Math.round(g[1] / TOT * 100)}% de todo</div>` : ''}<div class="r">${g[0]} <span>${fmt(g[1])}</span></div><div class="b"><i style="--w:${(g[1] / max * 100).toFixed(1)}%;animation-delay:${hot ? 0 : t0 + .4 + k * .12}s"></i></div></div>`).join('');
h += sc(8, 'full', `<div class="say up" style="animation-delay:${8 * B + .05}s;font-size:76px">Con Eva, lo vio<br><span class="grad">en un segundo.</span></div><div class="rows up" style="animation-delay:${8 * B + .3}s">${filas(8 * B, false)}</div>`);
h += sc(9, 'full', `<div class="say" style="font-size:76px">Los domicilios se<br>llevaban el <span class="grad">17%.</span></div><div class="rows">${filas(9 * B, true)}</div>`);
h += sc(10, 'full mag', `<div class="say up" style="animation-delay:${10 * B + .05}s;font-size:90px">Comenta cuál<br><span style="color:var(--bg)">elegiste.</span></div>
  <div style="display:flex;gap:30px;margin-top:60px">${['A', 'B', 'C'].map((o, k) => `<div class="pop" style="animation-delay:${10 * B + .5 + k * .25}s;width:180px;height:180px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:100px;font-weight:900">${o}</div>`).join('')}</div>`);
h += sc(11, 'full mag', `<img class="wm" src="marca/eva-silueta-blanca.svg">
  <div class="up" style="animation-delay:${11 * B + .05}s;font-size:84px;font-weight:900;letter-spacing:-2.5px;position:relative">Que no te pase<br><span style="color:var(--bg)">a fin de mes.</span></div>
  <div class="logo pop" style="animation-delay:${11 * B + .6}s;margin-top:50px;position:relative"><span class="E">E</span><span class="va">va</span></div>
  <div class="pill pop" style="animation-delay:${11 * B + 1.2}s;position:relative">evafinanzas<span>.us</span></div>
  <div class="up" style="animation-delay:${11 * B + 1.7}s;font-size:44px;font-weight:800;margin-top:40px;color:#fff;position:relative">Prueba <b style="background:rgba(11,7,18,.85);padding:6px 18px;border-radius:14px;color:var(--save)">7 días gratis</b></div>`, 5);
document.getElementById('root').innerHTML = h;
// aviso de caso de ejemplo en las escenas con datos
document.querySelectorAll('.scene:not(.mag)').forEach(s => s.insertAdjacentHTML('beforeend', '<div class="ej">CASO DE EJEMPLO</div>'));
</script>
</body>
</html>
