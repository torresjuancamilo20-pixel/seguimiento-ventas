<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel posibles ventas · Nexus</title>
<link rel="icon" href="../reportes/favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{
 --ink:#e9eff8;--ink2:#aab6c8;--mut:#6b7688;--line:#1b2534;
 --paper:#05080f;--card:#0b111c;
 --sig:#2aa8ff;--sigd:#60c3ff;--sigdk:#0b5cc0;
 --good:#22d38a;--line2:rgba(42,168,255,.18);--gold:#f5c518;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:
 radial-gradient(900px 520px at 18% -8%,rgba(42,168,255,.10),transparent 60%),
 radial-gradient(760px 520px at 92% 108%,rgba(11,92,192,.12),transparent 60%),
 var(--paper);
 color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;color-scheme:dark}
.wrap{width:100%;max-width:860px;margin:0 auto;padding:28px 16px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:11px}
.brand .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2aa8ff,#0b4a8f);color:#fff;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:18px;box-shadow:0 0 22px rgba(42,168,255,.45)}
.brand .tx{font-family:'Space Grotesk';font-weight:700;letter-spacing:.2em;font-size:15px}
.btnr{background:#101a2b;border:1px solid var(--line2);color:var(--sigd);font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;cursor:pointer}
h1{font-family:'Space Grotesk';font-weight:700;font-size:28px;margin-bottom:4px}
.sub{color:var(--ink2);font-size:14px;margin-bottom:22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi.main{background:linear-gradient(160deg,rgba(42,168,255,.18),rgba(11,92,192,.05));border-color:var(--line2)}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:7px}
.kpi .n{font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:-.01em}
.kpi.main .n{color:var(--sigd)}
.kpi .n.green{color:var(--good)}
.h2{font-family:'Space Grotesk';font-weight:700;font-size:18px;margin:8px 0 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:26px}
.arow{border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.ahead{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none}
.ahead:hover{background:rgba(255,255,255,.02)}
.rank{flex:none;width:28px;text-align:center;font-family:'Space Grotesk';font-weight:700;color:var(--mut);font-size:15px}
.ava{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1e293b,#334155);display:grid;place-items:center;font-weight:700;font-size:14px;color:#dbe6f5}
.ainfo{flex:1;min-width:0}
.ainfo .nm{font-weight:700;font-size:16px}
.ainfo .mt{font-size:12.5px;color:var(--mut);margin-top:2px}
.anums{text-align:right;flex:none}
.anums .fact{font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--sigd)}
.anums .gan{font-size:12.5px;color:var(--good);font-weight:600;margin-top:2px}
.chev{flex:none;width:18px;color:var(--mut);transition:transform .2s}
.arow.open .chev{transform:rotate(90deg)}
.alist{display:none;padding:2px 18px 14px;background:rgba(0,0,0,.18)}
.arow.open .alist{display:block}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item .d{flex:1;min-width:0}
.item .cn{font-weight:700;font-size:15px}
.item .pr{font-size:13px;color:var(--ink2);margin-top:2px}
.item .obs{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.4}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.bdg{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--sigd);background:rgba(42,168,255,.08)}
.bdg.on{background:rgba(34,211,138,.14);border-color:rgba(34,211,138,.4);color:var(--good)}
.item .pfact{flex:none;text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:15px}
.comp{display:inline-block;font-size:11px;font-weight:800;color:#061019;background:var(--good);padding:2px 8px;border-radius:999px;margin-left:8px}
.loading,.empty{text-align:center;color:var(--mut);padding:40px 10px}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.kpi .n{font-size:22px}}
</style></head>
<body>
<div class="wrap">
 <div class="top">
  <div class="brand"><div class="mk">N</div><div class="tx">NEXUS</div></div>
  <button class="btnr" id="btnRef">↻ Actualizar</button>
 </div>
 <h1>Panel de posibles ventas</h1>
 <div class="sub" id="sub">Cargando…</div>

 <div class="kpis">
  <div class="kpi main"><div class="l">Facturación proyectada</div><div class="n" id="k_fact">—</div></div>
  <div class="kpi"><div class="l">Ganancia proyectada</div><div class="n green" id="k_gan">—</div></div>
  <div class="kpi"><div class="l">Posibles ventas</div><div class="n" id="k_num">—</div></div>
  <div class="kpi"><div class="l">Ya compraron</div><div class="n" id="k_comp">—</div></div>
 </div>

 <div class="h2">Por agente</div>
 <div class="panel" id="panel"><div class="loading">Cargando posibles ventas…</div></div>
</div>

<script>
const SUPABASE_URL="https://fhixjvxztmuifrioevze.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoaXhqdnh6dG11aWZyaW9ldnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjgxNTUsImV4cCI6MjA5OTM0NDE1NX0.sTBxjWYr5m90-usvIJQyvTXon3TkD9Nk0V9z6IDQtmo";
const HDRS={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const money=v=>'$'+Math.round(+v||0).toLocaleString('en-US');
const ini=n=>(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
let OPEN={};

async function load(){
 try{
  const [pv,prod]=await Promise.all([
   fetch(SUPABASE_URL+'/rest/v1/posibles_ventas?select=*&descartado=not.is.true&order=creado_fecha.desc',{headers:HDRS}).then(r=>r.json()),
   fetch(SUPABASE_URL+'/rest/v1/productos?select=id,nombre,precio,comision',{headers:HDRS}).then(r=>r.json())
  ]);
  render(pv||[], prod||[]);
 }catch(e){ $('panel').innerHTML='<div class="empty">No se pudo cargar. Revisa la conexión y actualiza.</div>'; $('sub').textContent='Error al cargar'; }
}

function render(pv, prod){
 const pById={}; prod.forEach(p=>pById[p.id]=p);
 let tf=0,tg=0,tc=0;
 const byAg={};
 pv.forEach(p=>{
  const pr=pById[p.membresia_id];
  const precio=pr?+pr.precio||0:0, com=pr?+pr.comision||0:0;
  tf+=precio; tg+=com; if(p.comprado)tc++;
  (byAg[p.agente]=byAg[p.agente]||[]).push({...p,precio,com,prodn:pr?pr.nombre:(p.producto||'—')});
 });
 $('k_fact').textContent=money(tf);
 $('k_gan').textContent=money(tg);
 $('k_num').textContent=pv.length;
 $('k_comp').textContent=tc;
 $('sub').textContent=pv.length+' posibles ventas · '+Object.keys(byAg).length+' agentes · actualizado '+new Date().toLocaleString('es-CO',{hour:'2-digit',minute:'2-digit'});

 const ags=Object.keys(byAg).map(a=>{
  const rows=byAg[a];
  return {a, rows, fact:rows.reduce((s,r)=>s+r.precio,0), gan:rows.reduce((s,r)=>s+r.com,0)};
 }).sort((x,y)=>y.fact-x.fact);

 if(!ags.length){ $('panel').innerHTML='<div class="empty">Aún no hay posibles ventas registradas.</div>'; return; }

 $('panel').innerHTML=ags.map((g,i)=>{
  const items=g.rows.map(r=>{
   const b=[];
   b.push(`<span class="bdg ${r.inv_presentacion?'on':''}">Presentación</span>`);
   b.push(`<span class="bdg ${r.uno_a_uno?'on':''}">1 a 1</span>`);
   b.push(`<span class="bdg ${r.inv_clase?'on':''}">Clase avanzada</span>`);
   return `<div class="item"><div class="d"><div class="cn">${esc(r.nombre)||'(sin nombre)'}${r.comprado?'<span class="comp">COMPRÓ</span>':''}</div>
     <div class="pr">${esc(r.prodn)} · ${money(r.precio)}</div>
     ${r.observacion?`<div class="obs">${esc(r.observacion)}</div>`:''}
     <div class="badges">${b.join('')}</div></div>
     <div class="pfact">${money(r.precio)}</div></div>`;
  }).join('');
  return `<div class="arow ${OPEN[g.a]?'open':''}" data-a="${esc(g.a)}">
    <div class="ahead"><div class="rank">${i+1}</div><div class="ava">${esc(ini(g.a))}</div>
      <div class="ainfo"><div class="nm">${esc(g.a)}</div><div class="mt">${g.rows.length} posible${g.rows.length!==1?'s':''} · gana ${money(g.gan)}</div></div>
      <div class="anums"><div class="fact">${money(g.fact)}</div><div class="gan">+${money(g.gan)} ganancia</div></div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div><div class="alist">${items}</div></div>`;
 }).join('');

 document.querySelectorAll('.ahead').forEach(h=>h.onclick=()=>{
  const row=h.parentElement, a=row.dataset.a; OPEN[a]=!row.classList.contains('open'); row.classList.toggle('open');
 });
}

$('btnRef').onclick=load;
load();
</script>
</body></html>
